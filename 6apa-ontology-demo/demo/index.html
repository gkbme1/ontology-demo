<title>6-APA 工业本体</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* 6-APA 生产线工业本体 · 深色工业风格
   单一深色主题：控制室环境下使用，不随系统主题切换，
   所有颜色显式定义，不依赖宿主背景。 */

:root {
  color-scheme: dark;

  --bg: #0a111d;
  --panel: #101a2b;
  --panel-2: #16233a;
  --raised: #1c2c46;
  --line: #23344f;
  --line-soft: #1a2940;

  --text: #dde7f7;
  --text-2: #9fb0cc;
  --muted: #6f819e;

  --accent: #35c4d7;
  --accent-ink: #0a111d;
  --accent-soft: rgba(53, 196, 215, 0.13);

  --ok: #3fcf8e;
  --warn: #f2c744;
  --err: #f2557a;
  --info: #4c8dff;
  --equip: #ff9f45;
  --part: #b07cff;
  --prop: #3fcf8e;
  --tag: #f2c744;
  --unmatched: #6b7a90;

  --r-sm: 4px;
  --r-md: 7px;
  --r-lg: 11px;

  --font-sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(53, 196, 215, 0.3); }

.mono { font-family: var(--font-mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------ 骨架 */

.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  height: 54px;
  background: linear-gradient(180deg, #14213a, #0e1729);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 30;
}

.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.brand .sub {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.topbar-spacer { flex: 1; }

.svc {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(63, 207, 142, 0.07);
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
}
.svc .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(63, 207, 142, 0.16);
}

.src-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--panel-2);
  color: var(--text-2);
  font-size: 11px;
  white-space: nowrap;
}
.chip .tick { color: var(--ok); }
.chip.is-missing { color: var(--muted); border-style: dashed; }
.chip.is-missing .tick { color: var(--muted); }

.layout {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr) 392px;
  min-height: 0;
}

/* ------------------------------------------------------------ 左栏 */

.rail {
  border-right: 1px solid var(--line);
  background: var(--panel);
  padding: 14px 0 32px;
  overflow-y: auto;
  max-height: calc(100vh - 54px);
  position: sticky;
  top: 54px;
}

.rail-group + .rail-group { margin-top: 18px; }
.rail-title {
  padding: 0 16px 7px;
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.rail-item {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  padding: 7px 16px;
  border: 0;
  border-left: 2px solid transparent;
  background: none;
  cursor: pointer;
  text-align: left;
  color: var(--text-2);
  font-size: 12.5px;
}
.rail-item:hover { background: var(--panel-2); color: var(--text); }
.rail-item.is-active {
  background: var(--accent-soft);
  border-left-color: var(--accent);
  color: var(--text);
  font-weight: 500;
}
.rail-item .idx {
  width: 17px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.rail-item .count {
  margin-left: auto;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.rail-item.is-core .idx { color: var(--accent); }

/* ------------------------------------------------------------ 中栏 */

.canvas {
  min-width: 0;
  padding: 18px 22px 48px;
  overflow-y: auto;
  max-height: calc(100vh - 54px);
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--muted);
}
.crumbs button {
  border: 0; background: none; padding: 0; cursor: pointer;
  color: var(--text-2);
}
.crumbs button:hover { color: var(--accent); }
.crumbs .sep { color: var(--line); }
.crumbs .now { color: var(--text); }

.view-head { margin-bottom: 16px; }
.view-head h2 {
  margin: 0 0 4px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.view-head p { margin: 0; color: var(--text-2); max-width: 78ch; }

/* 统计砖 */
.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
  gap: 1px;
  background: var(--line-soft);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 18px;
}
.stat {
  background: var(--panel);
  padding: 13px 15px;
}
.stat .k {
  color: var(--muted);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}
.stat .v {
  margin-top: 3px;
  font-size: 23px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.stat .u { color: var(--muted); font-size: 11px; margin-left: 4px; font-weight: 400; }
.stat.is-accent .v { color: var(--accent); }
.stat.is-warn .v { color: var(--warn); }

.panel {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--panel);
  margin-bottom: 18px;
  overflow: hidden;
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--panel-2);
}
.panel-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
.panel-head .note { color: var(--muted); font-size: 11.5px; }
.panel-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.panel-body { padding: 14px 15px; }
.panel-body.flush { padding: 0; }

/* 表格 */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  position: sticky; top: 0;
  background: var(--panel-2);
  color: var(--muted);
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: left;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.tbl td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
table.tbl tbody tr { cursor: pointer; }
table.tbl tbody tr:hover { background: var(--panel-2); }
table.tbl tbody tr.is-active { background: var(--accent-soft); }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-y { max-height: 460px; overflow-y: auto; }

/* 徽标 */
.tag-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px;
  border-radius: var(--r-sm);
  border: 1px solid;
  font-size: 10.5px;
  white-space: nowrap;
}
.tag-pill .swatch { width: 7px; height: 7px; border-radius: 2px; }
.pill-ok { color: var(--ok); border-color: rgba(63, 207, 142, 0.4); background: rgba(63, 207, 142, 0.09); }
.pill-warn { color: var(--warn); border-color: rgba(242, 199, 68, 0.4); background: rgba(242, 199, 68, 0.09); }
.pill-err { color: var(--err); border-color: rgba(242, 85, 122, 0.4); background: rgba(242, 85, 122, 0.09); }
.pill-info { color: var(--info); border-color: rgba(76, 141, 255, 0.4); background: rgba(76, 141, 255, 0.09); }
.pill-mute { color: var(--muted); border-color: var(--line); background: var(--panel-2); border-style: dashed; }
.pill-plain { color: var(--text-2); border-color: var(--line); background: var(--panel-2); }

/* 控件 */
.ctl {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--panel-2);
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
}
.ctl:hover { border-color: var(--accent); color: var(--text); }
.ctl.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

select.ctl, input.ctl { cursor: auto; min-width: 0; }
select.ctl { cursor: pointer; padding-right: 7px; }
input.ctl::placeholder { color: var(--muted); }

.filters {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 12px 15px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--panel);
}
.filters label {
  display: inline-flex; flex-direction: column; gap: 3px;
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}

/* 关系图 */
.graph-shell { position: relative; height: 560px; background: radial-gradient(circle at 50% 42%, #132139 0%, #0b1322 72%); }
.graph-svg { display: block; touch-action: none; cursor: grab; }
.graph-node { cursor: pointer; }
.graph-node.is-selected > :first-child { stroke-width: 3.4; filter: drop-shadow(0 0 7px currentColor); }
.graph-node-label { fill: var(--text-2); font-size: 10.5px; font-family: var(--font-sans); pointer-events: none; }
.graph-node.is-root .graph-node-label { fill: var(--text); font-weight: 600; font-size: 12px; }
.graph-edge { cursor: pointer; }
.graph-edge:hover line:first-child { stroke-opacity: 1; }
.graph-edge.is-selected line:first-child { stroke-width: 3.6; stroke-opacity: 1; }
.graph-edge-label {
  font-size: 9.5px; font-family: var(--font-sans);
  fill-opacity: 0.88; cursor: pointer; paint-order: stroke;
  stroke: #0b1322; stroke-width: 3px; stroke-linejoin: round;
}
.graph-legend {
  position: absolute; left: 12px; bottom: 12px;
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  max-width: 62%;
  padding: 9px 11px;
  background: rgba(10, 17, 29, 0.86);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  font-size: 10.5px; color: var(--text-2);
}
.graph-legend span { display: inline-flex; align-items: center; gap: 5px; }
.graph-legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.graph-hint {
  position: absolute; right: 12px; bottom: 12px;
  color: var(--muted); font-size: 10.5px;
  background: rgba(10, 17, 29, 0.86);
  border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 6px 10px;
}
.graph-depth { position: absolute; right: 12px; top: 12px; display: flex; gap: 5px; }

/* 三层语义链 */
.chain { display: flex; flex-direction: column; gap: 0; }
.chain-node {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--panel-2);
}
.chain-node .lbl { color: var(--muted); font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; min-width: 74px; }
.chain-node .val { font-weight: 500; }
.chain-arrow { height: 16px; margin-left: 30px; border-left: 1px dashed var(--line); }
.chain-arrow + .chain-node { margin-top: 0; }

/* 树 */
.tree { font-size: 12.5px; }
.tree-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: var(--r-sm); cursor: pointer;
}
.tree-row:hover { background: var(--panel-2); }
.tree-row.is-active { background: var(--accent-soft); }
.tree-row .bullet { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.tree-row .meta { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tree-children { margin-left: 15px; border-left: 1px solid var(--line-soft); padding-left: 9px; }

/* 右栏 */
.inspector {
  border-left: 1px solid var(--line);
  background: var(--panel);
  padding: 16px 16px 48px;
  overflow-y: auto;
  max-height: calc(100vh - 54px);
  position: sticky;
  top: 54px;
}
.insp-kicker {
  color: var(--muted);
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
}
.insp-title { margin: 3px 0 10px; font-size: 16px; font-weight: 600; text-wrap: balance; }
.insp-section { margin-top: 16px; }
.insp-section > h4 {
  margin: 0 0 8px;
  font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  padding-bottom: 5px; border-bottom: 1px solid var(--line-soft);
}

dl.kv { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; font-size: 12.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; word-break: break-word; }

.source-box {
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  background: rgba(76, 141, 255, 0.05);
  padding: 9px 11px;
  font-size: 11.5px;
}
.source-box .hd { color: var(--info); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; }

.empty {
  padding: 26px 18px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  background: var(--panel-2);
  font-size: 12.5px;
}
.empty strong { display: block; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }

.note-line { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
.warn-line {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 9px 11px;
  border-left: 2px solid var(--warn);
  background: rgba(242, 199, 68, 0.07);
  color: var(--text-2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12px;
  margin-bottom: 12px;
}

.bar { height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; min-width: 54px; }
.bar > i { display: block; height: 100%; border-radius: 3px; }

.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.list-plain li:last-child { border-bottom: 0; }

.loading { padding: 60px 20px; text-align: center; color: var(--muted); }

@media (max-width: 1400px) {
  .layout { grid-template-columns: 208px minmax(0, 1fr) 340px; }
}

@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .rail, .inspector, .canvas { position: static; max-height: none; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .inspector { border-left: 0; border-top: 1px solid var(--line); }
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .canvas { padding: 16px; }
  .graph-shell { height: 440px; }
  .graph-legend { max-width: none; position: static; margin: 8px 12px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

<script>
/* ===== api.js ===== */
/*
 * 本体 API 客户端。
 *
 * 两种模式，对外接口完全一致：
 *   · live   —— window.__API_BASE__ 指向 FastAPI 本体服务，走真实 REST 请求
 *   · static —— 读取由 backend/tools/build_static_demo_data.py 导出的 API 快照，
 *               在浏览器内按同一份契约合成响应体
 *
 * 页面组件只调用本模块，不直接触碰任何数据表，
 * 满足“前端只能通过 API 获取本体数据和关系数据”的要求。
 */
(function (global) {
  'use strict';

  var D = global.__ONTO__ || {};
  var BASE = global.__API_BASE__ || null;
  var MODE = BASE ? 'live' : 'static';

  // ------------------------------------------------------------- 索引

  var idx = {
    areaById: {},
    equipById: {},
    paramById: {},
    tagById: {},
    relById: {},
    entityById: {},
    paramsByEquip: {},
    tagsByParam: {},
    tagsByEquip: {},
    equipByArea: {}
  };

  function buildIndexes() {
    (D.areas || []).forEach(function (a) { idx.areaById[a.id] = a; });
    (D.equipment || []).forEach(function (e) {
      idx.equipById[e.id] = e;
      (idx.equipByArea[e.a] = idx.equipByArea[e.a] || []).push(e);
    });
    (D.parameters || []).forEach(function (p) {
      idx.paramById[p.id] = p;
      (idx.paramsByEquip[p.e] = idx.paramsByEquip[p.e] || []).push(p);
    });
    (D.tags || []).forEach(function (t) {
      idx.tagById[t.id] = t;
      (idx.tagsByParam[t.p] = idx.tagsByParam[t.p] || []).push(t);
      (idx.tagsByEquip[t.e] = idx.tagsByEquip[t.e] || []).push(t);
    });
    (D.relations || []).forEach(function (r) { idx.relById[r.id] = r; });
    (D.relationEntities || []).forEach(function (e) { idx.entityById[e.id] = e; });
  }

  // ------------------------------------------------------------- 展开器
  // 紧凑表 → 与 REST 响应体一致的对象

  var DCS_FILE = (D.meta && D.meta.sourceFiles && D.meta.sourceFiles[0]) || '6APA_DCS.xlsx';
  var SHEET_TAGS = 'DCS点位明细';
  var SHEET_STATS = '设备统计';

  function equipOut(e) {
    if (!e) return null;
    var area = idx.areaById[e.a] || {};
    return {
      id: e.id, owlSubject: e.o, name: e.n,
      areaId: e.a, areaName: area.name, station: e.sn,
      tagCount: e.tc, parameterCount: e.pc,
      stats: e.s, statsFromSheet1: e.s1, overview: e.ov,
      sourceType: 'DCS_EXCEL',
      source: { file: DCS_FILE, sheet: SHEET_TAGS, row: e.r, field: '生产设备/装置 (Equipment Entity)', value: e.n },
      statsSource: e.r1 ? { file: DCS_FILE, sheet: SHEET_STATS, row: e.r1 } : null
    };
  }

  function paramOut(p) {
    if (!p) return null;
    var e = idx.equipById[p.e] || {};
    var area = idx.areaById[e.a] || {};
    return {
      id: p.id, name: p.n,
      equipmentId: p.e, equipmentName: e.n, owlSubject: e.o,
      areaId: e.a, areaName: area.name, station: e.sn,
      categories: p.c, units: p.u, blockTypes: p.b,
      tagCount: (p.t || []).length, tagIds: p.t,
      sourceType: 'DCS_EXCEL',
      source: { file: DCS_FILE, sheet: SHEET_TAGS, row: p.r, field: '参数语义名称 (Parameter Name)', value: p.n }
    };
  }

  function tagOut(t) {
    if (!t) return null;
    var e = idx.equipById[t.e] || {};
    var p = idx.paramById[t.p] || {};
    var area = idx.areaById[e.a] || {};
    return {
      id: t.id, name: t.n, rawDescription: t.d,
      station: e.sn, areaId: e.a, areaName: area.name,
      equipmentId: t.e, equipmentName: e.n,
      parameterId: t.p, parameterName: p.n,
      parameterType: t.pt, unit: t.u, blockType: t.b,
      owlSubject: e.o,
      sourceType: 'DCS_EXCEL',
      source: { file: DCS_FILE, sheet: SHEET_TAGS, row: t.r }
    };
  }

  function page(items, q) {
    var offset = +(q && q.offset) || 0;
    var limit = q && q.limit ? +q.limit : null;
    return {
      items: limit ? items.slice(offset, offset + limit) : items.slice(offset),
      total: items.length,
      offset: offset
    };
  }

  // ------------------------------------------------------------- 关系筛选

  function filterRelations(q) {
    q = q || {};
    var items = (D.relations || []).slice();
    function eq(field, key) {
      if (q[key]) items = items.filter(function (r) { return r[field] === q[key]; });
    }
    eq('area', 'area'); eq('category', 'category'); eq('predicate', 'predicate');
    eq('scenario', 'scenario'); eq('subjectType', 'subjectType'); eq('objectType', 'objectType');
    if (q.entityId) {
      items = items.filter(function (r) {
        return r.subject.id === q.entityId || r.object.id === q.entityId;
      });
    }
    if (q.minWeight != null && q.minWeight !== '') {
      items = items.filter(function (r) { return r.weight != null && r.weight >= +q.minWeight; });
    }
    if (q.maxWeight != null && q.maxWeight !== '') {
      items = items.filter(function (r) { return r.weight != null && r.weight <= +q.maxWeight; });
    }
    if (q.matched === true || q.matched === false) {
      items = items.filter(function (r) { return (r.matchStatus === 'MATCHED') === q.matched; });
    }
    if (q.causal) items = items.filter(function (r) { return r.isCausal; });
    if (q.keyword) {
      var k = q.keyword;
      items = items.filter(function (r) {
        return (r.subjectEntity || '').indexOf(k) >= 0 || (r.objectEntity || '').indexOf(k) >= 0 ||
          (r.predicate || '').indexOf(k) >= 0 || (r.domainDescription || '').indexOf(k) >= 0;
      });
    }
    return items;
  }

  // ------------------------------------------------------------- 关系图

  var MAX_NODES = 220;

  function styleFor(type, matched) {
    var list = (D.categories && D.categories.nodeStyles) || [];
    var found = null;
    for (var i = 0; i < list.length; i++) if (list[i].type === type) { found = list[i]; break; }
    var fallback = null;
    for (var j = 0; j < list.length; j++) if (list[j].type === '外部对象') { fallback = list[j]; break; }
    var s = found || fallback || { color: '#6B7A90', shape: 'circle' };
    return { color: matched ? s.color : (fallback ? fallback.color : '#6B7A90'), shape: s.shape };
  }

  function edgeStyleFor(category, matched, weight) {
    var list = (D.categories && D.categories.edgeStyles) || [];
    var s = null, un = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].category === category) s = list[i];
      if (list[i].category === '未匹配关系') un = list[i];
    }
    s = matched ? (s || list[0]) : (un || s || list[0]);
    if (!s) s = { color: '#8FA6C4', lineStyle: 'solid', width: 1.6 };
    var w = weight == null ? 1 : weight;
    return {
      color: s.color,
      lineStyle: s.lineStyle,
      width: +(s.width * (0.7 + 0.45 * w)).toFixed(2),
      opacity: +Math.min(1, 0.55 + 0.22 * w).toFixed(2)
    };
  }

  function entityNode(id, isRoot) {
    var e = idx.entityById[id];
    if (!e) return null;
    var matched = e.matchStatus === 'MATCHED';
    return {
      id: id, label: e.name, type: e.type, nodeKind: 'relationEntity',
      matchStatus: e.matchStatus, matchStatusLabel: e.matchStatusLabel,
      matchCount: e.matchCount, tagCount: e.tagCount, relationCount: e.relationCount,
      areas: e.areas, isRoot: !!isRoot, sourceType: 'RELATION_EXCEL',
      style: styleFor(e.type, matched)
    };
  }

  function equipNode(id, isRoot) {
    var e = idx.equipById[id];
    if (!e) return null;
    var area = idx.areaById[e.a] || {};
    return {
      id: id, label: e.n, type: '生产设备', nodeKind: 'equipment',
      owlSubject: e.o, areaName: area.name, station: e.sn, tagCount: e.tc,
      matchStatus: 'MATCHED', isRoot: !!isRoot, sourceType: 'DCS_EXCEL',
      style: styleFor('生产设备', true)
    };
  }

  function paramNode(id, isRoot) {
    var p = idx.paramById[id];
    if (!p) return null;
    var e = idx.equipById[p.e] || {};
    return {
      id: id, label: p.n, type: '参数', nodeKind: 'parameter',
      equipmentName: e.n, categories: p.c, units: p.u, tagCount: (p.t || []).length,
      matchStatus: 'MATCHED', isRoot: !!isRoot, sourceType: 'DCS_EXCEL',
      style: styleFor('参数', true)
    };
  }

  function tagNode(id) {
    var t = idx.tagById[id];
    if (!t) return null;
    return {
      id: id, label: t.n, type: 'DCS点', nodeKind: 'tag',
      rawDescription: t.d, blockType: t.b, unit: t.u,
      matchStatus: 'MATCHED', sourceType: 'DCS_EXCEL',
      style: styleFor('DCS点', true)
    };
  }

  function areaNode(id, isRoot) {
    var a = idx.areaById[id];
    if (!a) return null;
    return {
      id: id, label: a.nameZh, type: '生产工段', nodeKind: 'area',
      fullName: a.name, tagCount: a.tagCount,
      matchStatus: 'MATCHED', isRoot: !!isRoot, sourceType: 'DCS_EXCEL',
      style: styleFor('生产工段', true)
    };
  }

  function structEdge(id, source, target, label, kind, color) {
    return {
      id: id, source: source, target: target, label: label,
      category: '本体结构', edgeKind: kind, weight: 1, matchStatus: 'MATCHED',
      sourceType: 'DCS_EXCEL',
      style: { color: color, lineStyle: 'solid', width: 1.4, opacity: 0.75 }
    };
  }

  function addRelation(rel, nodes, edges) {
    var sid = rel.subject.id, oid = rel.object.id;
    if (!sid || !oid) return;
    [sid, oid].forEach(function (nid) {
      if (!nodes[nid]) { var n = entityNode(nid); if (n) nodes[nid] = n; }
    });
    edges[rel.id] = {
      id: rel.id, source: sid, target: oid, label: rel.predicate,
      category: rel.category, area: rel.area, scenario: rel.scenario,
      weight: rel.weight, domainDescription: rel.domainDescription,
      matchStatus: rel.matchStatus, edgeKind: 'relation',
      // source/target 已用于图的端点，来源信息放在 provenance 字段
      sourceType: rel.sourceType, provenance: rel.source,
      style: edgeStyleFor(rel.category, rel.matchStatus === 'MATCHED', rel.weight)
    };
  }

  function buildGraph(q) {
    q = q || {};
    var depth = Math.max(1, Math.min(3, +(q.depth || 1)));
    var pool = filterRelations(q);
    var nodes = {}, edges = {}, truncated = false;
    var rootId = q.rootId || null;

    if (rootId && rootId.indexOf('robj-') === 0) {
      var root = entityNode(rootId, true);
      if (root) {
        nodes[rootId] = root;
        var byEntity = {};
        pool.forEach(function (r) {
          ['subject', 'object'].forEach(function (side) {
            var eid = r[side].id;
            if (eid) (byEntity[eid] = byEntity[eid] || []).push(r);
          });
        });
        var frontier = [rootId];
        for (var d = 0; d < depth && !truncated; d++) {
          var next = {};
          frontier.forEach(function (eid) {
            (byEntity[eid] || []).forEach(function (rel) {
              if (edges[rel.id]) return;
              addRelation(rel, nodes, edges);
              ['subject', 'object'].forEach(function (side) {
                var other = rel[side].id;
                if (other && other !== eid) next[other] = 1;
              });
              if (Object.keys(nodes).length > MAX_NODES) truncated = true;
            });
          });
          frontier = Object.keys(next);
        }
        if (q.includeDcs) attachAnchors(rootId, nodes, edges);
      }
    } else if (rootId && rootId.indexOf('equip-') === 0) {
      truncated = expandEquipment(rootId, nodes, edges, pool, depth);
    } else if (rootId && rootId.indexOf('param-') === 0) {
      expandParameter(rootId, nodes, edges, pool);
    } else if (rootId && rootId.indexOf('area-') === 0) {
      truncated = expandArea(rootId, nodes, edges, pool);
    } else {
      for (var i = 0; i < pool.length; i++) {
        addRelation(pool[i], nodes, edges);
        if (Object.keys(nodes).length > MAX_NODES) { truncated = true; break; }
      }
    }

    return {
      rootId: rootId, rootType: q.rootType || null, depth: depth,
      nodes: Object.keys(nodes).map(function (k) { return nodes[k]; }),
      edges: Object.keys(edges).map(function (k) { return edges[k]; }),
      nodeCount: Object.keys(nodes).length,
      edgeCount: Object.keys(edges).length,
      truncated: truncated, maxNodes: MAX_NODES,
      nodeStyles: (D.categories || {}).nodeStyles,
      edgeStyles: (D.categories || {}).edgeStyles
    };
  }

  function attachAnchors(entityId, nodes, edges) {
    var detail = (D.entityDetails || {})[entityId];
    if (!detail) return;
    (detail.matches || []).slice(0, 8).forEach(function (m) {
      var nid, n;
      if (m.objectType === 'equipment') {
        n = equipNode(m.id);
        if (!n) return;
        nid = 'dcs::' + m.id; n.id = nid; nodes[nid] = n;
        edges['map::' + entityId + '::' + nid] =
          structEdge('map::' + entityId + '::' + nid, entityId, nid, '匹配本体实例', 'mapping', '#6B7A90');
      } else if (m.objectType === 'parameter') {
        n = paramNode(m.id);
        if (!n) return;
        nid = 'dcs::' + m.id; n.id = nid; nodes[nid] = n;
        edges['map::' + entityId + '::' + nid] =
          structEdge('map::' + entityId + '::' + nid, entityId, nid, '测量锚点', 'anchor', '#F2C744');
        (m.tagIds || []).slice(0, 3).forEach(function (tid) {
          var t = tagNode(tid);
          if (!t) return;
          var tnid = 'dcs::' + tid; t.id = tnid; nodes[tnid] = t;
          edges['tag::' + nid + '::' + tnid] =
            structEdge('tag::' + nid + '::' + tnid, nid, tnid, 'boundToTag', 'tag', '#F2C744');
        });
      }
    });
  }

  function expandEquipment(equipmentId, nodes, edges, pool, depth) {
    var e = idx.equipById[equipmentId];
    if (!e) return false;
    nodes[equipmentId] = equipNode(equipmentId, true);
    if (e.a) {
      var a = areaNode(e.a);
      if (a) {
        nodes[a.id] = a;
        edges['has::' + a.id + '::' + equipmentId] =
          structEdge('has::' + a.id + '::' + equipmentId, a.id, equipmentId, 'hasEquipment', 'structure', '#4C8DFF');
      }
    }
    var truncated = false;
    (e.p || []).forEach(function (pid) {
      if (Object.keys(nodes).length > MAX_NODES) { truncated = true; return; }
      var n = paramNode(pid);
      if (!n) return;
      nodes[pid] = n;
      edges['has::' + equipmentId + '::' + pid] =
        structEdge('has::' + equipmentId + '::' + pid, equipmentId, pid, 'hasParameter', 'structure', '#35C4D7');
      if (depth >= 2) {
        ((idx.paramById[pid] || {}).t || []).forEach(function (tid) {
          if (Object.keys(nodes).length > MAX_NODES) { truncated = true; return; }
          var t = tagNode(tid);
          if (!t) return;
          nodes[tid] = t;
          edges['tag::' + pid + '::' + tid] =
            structEdge('tag::' + pid + '::' + tid, pid, tid, 'boundToTag', 'tag', '#F2C744');
        });
      }
    });
    linkEntities(equipmentId, nodes, edges, pool, '匹配本体实例', 'mapping', '#6B7A90');
    return truncated;
  }

  function expandParameter(parameterId, nodes, edges, pool) {
    var p = idx.paramById[parameterId];
    if (!p) return false;
    nodes[parameterId] = paramNode(parameterId, true);
    if (p.e) {
      var e = equipNode(p.e);
      if (e) {
        nodes[e.id] = e;
        edges['has::' + e.id + '::' + parameterId] =
          structEdge('has::' + e.id + '::' + parameterId, e.id, parameterId, 'hasParameter', 'structure', '#35C4D7');
      }
    }
    (p.t || []).forEach(function (tid) {
      var t = tagNode(tid);
      if (!t) return;
      nodes[tid] = t;
      edges['tag::' + parameterId + '::' + tid] =
        structEdge('tag::' + parameterId + '::' + tid, parameterId, tid, 'boundToTag', 'tag', '#F2C744');
    });
    linkEntities(parameterId, nodes, edges, pool, '测量锚点', 'anchor', '#F2C744');
    return false;
  }

  function linkEntities(objectId, nodes, edges, pool, label, kind, color) {
    var entityIds = (D.matchIndex || {})[objectId] || [];
    var relIds = {};
    entityIds.forEach(function (eid) {
      var n = entityNode(eid);
      if (!n) return;
      nodes[eid] = n;
      edges['map::' + eid + '::' + objectId] =
        structEdge('map::' + eid + '::' + objectId, eid, objectId, label, kind, color);
      var detail = (D.entityDetails || {})[eid];
      if (detail) {
        (detail.outgoingRelations || []).concat(detail.incomingRelations || [])
          .forEach(function (r) { relIds[r.id] = 1; });
      }
    });
    pool.forEach(function (r) { if (relIds[r.id]) addRelation(r, nodes, edges); });
  }

  function expandArea(areaId, nodes, edges, pool) {
    var a = idx.areaById[areaId];
    if (!a) return false;
    nodes[areaId] = areaNode(areaId, true);
    var list = (idx.equipByArea[areaId] || []).slice()
      .sort(function (x, y) { return y.tc - x.tc; }).slice(0, 24);
    list.forEach(function (e) {
      var n = equipNode(e.id);
      if (!n) return;
      nodes[e.id] = n;
      edges['has::' + areaId + '::' + e.id] =
        structEdge('has::' + areaId + '::' + e.id, areaId, e.id, 'hasEquipment', 'structure', '#4C8DFF');
    });
    pool.forEach(function (r) { if (r.dcsAreaId === areaId) addRelation(r, nodes, edges); });
    return (idx.equipByArea[areaId] || []).length > list.length;
  }

  // ------------------------------------------------------------- 静态实现

  var staticApi = {
    getOverview: function () { return D.overview; },
    getCategories: function () { return D.categories; },
    getProcessAreas: function () { return { items: D.areas, total: (D.areas || []).length }; },

    getProcessArea: function (areaId) {
      var area = idx.areaById[areaId];
      if (!area) return null;
      var equipment = (idx.equipByArea[areaId] || []).slice()
        .sort(function (a, b) { return b.tc - a.tc; }).map(equipOut);
      var rels = (D.relations || []).filter(function (r) { return r.dcsAreaId === areaId; });
      var byCategory = {};
      rels.forEach(function (r) {
        var k = r.category || '未标注';
        byCategory[k] = (byCategory[k] || 0) + 1;
      });
      return Object.assign({}, area, {
        equipment: equipment,
        relations: rels,
        relationCategoryCounts: byCategory
      });
    },

    getEquipment: function (q) {
      q = q || {};
      var items = D.equipment || [];
      if (q.sn) items = items.filter(function (e) { return String(e.sn) === String(q.sn); });
      if (q.areaId) items = items.filter(function (e) { return e.a === q.areaId; });
      if (q.keyword) items = items.filter(function (e) {
        return e.n.indexOf(q.keyword) >= 0 || (e.o || '').indexOf(q.keyword) >= 0;
      });
      items = items.slice().sort(function (a, b) { return b.tc - a.tc; });
      var p = page(items, q);
      p.items = p.items.map(equipOut);
      return p;
    },

    getEquipmentDetail: function (equipmentId) {
      var e = idx.equipById[equipmentId];
      if (!e) return null;
      var out = equipOut(e);
      var entityIds = (D.matchIndex || {})[equipmentId] || [];
      var relIds = {}, entities = [];
      entityIds.forEach(function (eid) {
        var brief = idx.entityById[eid];
        if (brief) entities.push(brief);
        var detail = (D.entityDetails || {})[eid];
        if (detail) {
          (detail.outgoingRelations || []).concat(detail.incomingRelations || [])
            .forEach(function (r) { relIds[r.id] = 1; });
        }
      });
      out.area = idx.areaById[e.a] || null;
      out.parameters = (idx.paramsByEquip[equipmentId] || []).map(paramOut);
      out.tags = (idx.tagsByEquip[equipmentId] || []).map(tagOut);
      out.relationEntities = entities;
      out.relations = (D.relations || []).filter(function (r) { return relIds[r.id]; });
      out.rules = rulesFor(e.n);
      return out;
    },

    getParameters: function (q) {
      q = q || {};
      var items = D.parameters || [];
      if (q.equipmentId) items = items.filter(function (p) { return p.e === q.equipmentId; });
      if (q.areaId) items = items.filter(function (p) {
        var e = idx.equipById[p.e]; return e && e.a === q.areaId;
      });
      if (q.category) items = items.filter(function (p) { return (p.c || []).indexOf(q.category) >= 0; });
      if (q.keyword) items = items.filter(function (p) { return p.n.indexOf(q.keyword) >= 0; });
      var pg = page(items, q);
      pg.items = pg.items.map(paramOut);
      return pg;
    },

    getParameterDetail: function (parameterId) {
      var p = idx.paramById[parameterId];
      if (!p) return null;
      var out = paramOut(p);
      var tags = (idx.tagsByParam[parameterId] || []).map(tagOut);
      out.equipment = equipOut(idx.equipById[p.e]);
      out.tags = tags;
      out.measurementAnchors = tags.map(function (t) { return anchorFrom(out, t); });
      var entityIds = (D.matchIndex || {})[parameterId] || [];
      var relIds = {}, entities = [];
      entityIds.forEach(function (eid) {
        var brief = idx.entityById[eid];
        if (brief) entities.push(brief);
        var detail = (D.entityDetails || {})[eid];
        if (detail) {
          (detail.outgoingRelations || []).concat(detail.incomingRelations || [])
            .forEach(function (r) { relIds[r.id] = 1; });
        }
      });
      out.relationEntities = entities;
      out.relations = (D.relations || []).filter(function (r) { return relIds[r.id]; });
      out.rules = rulesFor(p.n);
      return out;
    },

    getTags: function (q) {
      q = q || {};
      var items = D.tags || [];
      if (q.equipmentId) items = idx.tagsByEquip[q.equipmentId] || [];
      if (q.parameter) items = idx.tagsByParam[q.parameter] || [];
      if (q.areaId) items = items.filter(function (t) {
        var e = idx.equipById[t.e]; return e && e.a === q.areaId;
      });
      if (q.type) items = items.filter(function (t) { return t.pt === q.type; });
      if (q.blockType) items = items.filter(function (t) { return t.b === q.blockType; });
      if (q.keyword) items = items.filter(function (t) {
        return t.n.indexOf(q.keyword) >= 0 || (t.d || '').indexOf(q.keyword) >= 0;
      });
      var pg = page(items, q);
      pg.items = pg.items.map(tagOut);
      return pg;
    },

    getClasses: function () { return { items: D.classes, total: (D.classes || []).length }; },
    getProperties: function () { return { items: D.properties, total: (D.properties || []).length }; },
    getPredicates: function () { return { items: D.predicates, total: (D.predicates || []).length }; },

    getRelations: function (q) { return page(filterRelations(q), q); },

    getRelationDetail: function (relationId) {
      var rel = idx.relById[relationId];
      if (!rel) return null;
      return Object.assign({}, rel, {
        subjectDetail: idx.entityById[rel.subject.id] || null,
        objectDetail: idx.entityById[rel.object.id] || null,
        sameCategoryRelationIds: (D.relations || [])
          .filter(function (r) { return r.category === rel.category && r.id !== relationId; })
          .map(function (r) { return r.id; }),
        sameAreaRelationIds: (D.relations || [])
          .filter(function (r) { return r.area === rel.area && r.id !== relationId; })
          .map(function (r) { return r.id; }),
        sourceTypeLabel: '工业关系 Excel'
      });
    },

    getRelationEntities: function (q) {
      q = q || {};
      var items = (D.relationEntities || []).slice();
      if (q.type) items = items.filter(function (e) { return e.type === q.type; });
      if (q.matched === true || q.matched === false) {
        var want = q.matched ? 'MATCHED' : 'UNMATCHED';
        items = items.filter(function (e) { return e.matchStatus === want; });
      }
      if (q.keyword) items = items.filter(function (e) { return e.name.indexOf(q.keyword) >= 0; });
      items.sort(function (a, b) { return b.relationCount - a.relationCount; });
      return { items: items, total: items.length };
    },

    getRelationEntityDetail: function (entityId) { return (D.entityDetails || {})[entityId] || null; },

    getGraph: function (q) { return buildGraph(q); },

    getRules: function () { return D.rules; },
    getConstraints: function () { return (D.emptySets || {}).constraints; },
    getCapabilities: function () { return (D.emptySets || {}).capabilities; },
    getModelRegistry: function () { return (D.emptySets || {}).modelRegistry; },

    getSemantics: function (q) {
      q = q || {};
      var tags = D.tags || [];
      if (q.areaId) tags = tags.filter(function (t) {
        var e = idx.equipById[t.e]; return e && e.a === q.areaId;
      });
      if (q.keyword) tags = tags.filter(function (t) { return (t.d || '').indexOf(q.keyword) >= 0; });
      var limit = q.limit ? +q.limit : 200;
      return {
        dcsSemantics: tags.slice(0, limit).map(function (t) {
          var full = tagOut(t);
          return {
            id: full.id, rawDescription: full.rawDescription,
            parameterSemantic: full.parameterName, parameterId: full.parameterId,
            industrialObject: full.equipmentName, equipmentId: full.equipmentId,
            owlSubject: full.owlSubject, areaName: full.areaName,
            tagName: full.name, blockType: full.blockType,
            kind: 'DCS语义提升', sourceType: 'DCS_EXCEL', source: full.source

 * 局部语义图渲染器（零依赖 SVG 力导向布局）。

  function mountGraph(q) {
    var host = document.getElementById('graph-host');
    if (!host) return;
    q = Object.assign({ includeDcs: S.showDcs }, q);
    api.getGraph(q).then(function (g) {
      if (graph) graph.destroy();
      graph = new global.RelationGraph(host, {
        onNodeClick: function (node) { inspectNode(node); },
        onEdgeClick: function (edge) {
          if (edge.edgeKind === 'relation') return inspectRelation(edge.id);
          inspectStructuralEdge(edge);
        }
      });
      graph.render(g);
      var hint = host.parentElement.querySelector('.graph-hint');
      if (hint) {
        hint.innerHTML = '节点 ' + g.nodeCount + ' · 边 ' + g.edgeCount +
          (g.truncated ? ' · <span style="color:var(--warn)">已截断，请收紧筛选</span>' : '') +
          ' · 滚轮缩放 / 拖拽平移 / 点击查看详情';
      }
    });
  }

  function inspectNode(node) {
    if (node.nodeKind === 'relationEntity') { inspectEntity(node.id); return; }
    var id = String(node.id).replace(/^dcs::/, '');
    if (node.nodeKind === 'equipment') { inspectEquipment(id); return; }
    if (node.nodeKind === 'parameter') { inspectParameter(id); return; }
    if (node.nodeKind === 'tag') { inspectTag(id, node); return; }
    if (node.nodeKind === 'area') { go({ view: 'area', areaId: id }); }
  }

      '<p>' + esc(cat.description) + '　<span class="mono" style="color:var(--muted)">' + esc(cat.endpoint) + '</span></p></div>';

    var K = S.categoryKey;

    if (K === 'class') {
      api.getClasses().then(function (res) {
        var rows = res.items.map(function (c) {
          return '<tr><td class="mono">' + dash(c.uri) + '</td><td><strong>' + esc(c.label) + '</strong></td>' +
            '<td>' + esc(c.kind) + '</td><td class="num mono">' + n(c.instanceCount) + '</td>' +
            '<td class="mono" style="font-size:11px;color:var(--text-2)">' + dash(c.example) + '</td>' +
            '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(c.sourceType) + '</td></tr>';
        }).join('');
        done(head + '<div class="panel"><div class="panel-body flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>URI</th><th>中文语义</th><th>建模要素</th><th class="num">实例数</th><th>三元组示例</th><th>来源</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div></div></div>');
      });

    } else if (K === 'instance') {
      api.getEquipment({ limit: 300 }).then(function (res) {
        var rows = res.items.map(function (e) {
          return '<tr data-equip="' + esc(e.id) + '"><td><strong>' + esc(e.name) + '</strong></td>' +
            '<td class="mono" style="font-size:11px">' + esc(e.owlSubject) + '</td>' +
            '<td>' + esc(e.areaName || '') + '</td><td class="mono">' + esc(e.station) + '</td>' +
            '<td class="num mono">' + n(e.parameterCount) + '</td><td class="num mono">' + n(e.tagCount) + '</td></tr>';
        }).join('');
        done(head + '<div class="panel"><div class="panel-head"><h3>设备实例</h3>' +
          '<span class="note">按点位数排序，显示前 300 台，共 ' + n(res.total) + ' 台</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
          '<th>设备</th><th>OWL Subject</th><th>工段</th><th>控制站</th>' +
          '<th class="num">参数</th><th class="num">点位</th></tr></thead><tbody>' + rows +
          '</tbody></table></div></div></div>');
      });

    } else if (K === 'property') {
      api.getProperties().then(function (res) {
        var groups = {};
        res.items.forEach(function (p) { (groups[p.kind] = groups[p.kind] || []).push(p); });
        var blocks = Object.keys(groups).map(function (k) {
          var rows = groups[k].map(function (p) {
            return '<tr><td class="mono">' + esc(p.name) + '</td><td>' + dash(p.label) + '</td>' +
              '<td class="mono" style="font-size:11px">' + dash(p.domain) + '</td>' +
              '<td class="mono" style="font-size:11px">' + dash(p.range) + '</td>' +
              '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(p.sourceType) + '</td></tr>';
          }).join('');
          return '<div class="panel"><div class="panel-head"><h3>' + esc(k) + '</h3>' +
            '<span class="note">' + groups[k].length + ' 项</span></div><div class="panel-body flush">' +
            '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>属性名 / 字段</th><th>中文语义</th>' +
            '<th>Domain</th><th>Range</th><th>来源</th></tr></thead><tbody>' + rows +
            '</tbody></table></div></div></div>';
        }).join('');
        done(head + blocks);
      });

    } else if (K === 'relation') {
      api.getPredicates().then(function (res) {
        var rows = res.items.map(function (p) {
          return '<tr' + (p.count ? ' data-predicate="' + esc(p.predicate) + '"' : '') + '>' +
            '<td class="mono">' + esc(p.predicate) + '</td><td>' + dash(p.label) + '</td>' +
            '<td>' + (p.categories || []).map(function (c) {
              return '<span class="tag-pill pill-plain">' + esc(c) + '</span>';
            }).join(' ') + '</td>' +
            '<td class="num mono">' + (p.count == null ? '—' : n(p.count)) + '</td>' +
            '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(p.sourceType) + '</td></tr>';
        }).join('');
        done(head + '<div class="panel"><div class="panel-head"><h3>关系谓词</h3>' +
          '<span class="note">Schema 定义的对象属性 + 关系 Excel 中实际出现的谓词；点击可跳转到关系清单</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>谓词 / 边类型</th><th>中文语义</th><th>所属关系大类</th><th class="num">出现次数</th><th>来源</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div></div></div>');
      });

    } else if (K === 'constraint' || K === 'capability' || K === 'modelRegistry') {
      var fn = K === 'constraint' ? api.getConstraints : K === 'capability' ? api.getCapabilities : api.getModelRegistry;
      fn().then(function (res) {
        done(head + '<div class="panel"><div class="panel-body">' +
          emptyState(res.emptyReason, '期望数据源：' + (res.expectedSource || '')) + '</div></div>');
      });

    } else if (K === 'rule') {
      api.getRules().then(function (res) {
        if (res.total) {
          var rows = res.items.map(function (r) {
            return '<tr><td class="mono">' + esc(r.ruleId) + '</td><td><strong>' + esc(r.name) + '</strong></td>' +
              '<td>' + dash(r.appliesTo) + '</td><td>' + dash(r.condition) + '</td>' +
              '<td>' + dash(r.conclusion) + '</td><td>' + dash(r.severity) + '</td>' +
              '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(r.sourceType) + '</td></tr>';
          }).join('');
          return done(head + '<div class="panel"><div class="panel-body flush"><div class="tbl-wrap">' +
            '<table class="tbl"><thead><tr><th>规则编号</th><th>规则名称</th><th>适用对象</th>' +
            '<th>条件</th><th>推理结论</th><th>严重程度</th><th>来源</th></tr></thead><tbody>' + rows +
            '</tbody></table></div></div></div>');
        }
        var cols = (res.templateColumns || []).map(function (c) {
          return '<li class="mono">' + esc(c) + '</li>';
        }).join('');
        done(head +
          '<div class="panel"><div class="panel-head"><h3>规则数据源</h3>' +
          '<div class="right"><span class="tag-pill pill-mute">未提供</span></div></div>' +
          '<div class="panel-body">' + emptyState(res.emptyReason, '') +
          '<div style="margin-top:16px"><p class="note-line">规则文件就位后即自动加载，' +
          '期望文件名 <span class="mono">' + esc(res.expectedSource) + '</span>，' +
          'Sheet「规则明细」字段如下（仓库内已提供空表模板 <span class="mono">6APA_规则.模板.xlsx</span>）：</p>' +
          '<ul class="list-plain" style="columns:2;column-gap:28px">' + cols + '</ul></div>' +
          '</div></div>');
      });

    } else if (K === 'semantic') {
      api.getSemantics({ limit: 150 }).then(function (res) {
        var rows = res.dcsSemantics.map(function (x) {
          return '<tr data-param="' + esc(x.parameterId) + '">' +
            '<td style="color:var(--text-2)">' + esc(x.rawDescription) + '</td>' +
            '<td><strong>' + esc(x.parameterSemantic) + '</strong></td>' +
            '<td>' + esc(x.industrialObject) + '</td>' +
            '<td class="mono" style="font-size:11px">' + esc(x.owlSubject) + '</td>' +
            '<td class="mono">' + esc(x.tagName) + '</td></tr>';
        }).join('');
        var relRows = res.relationSemantics.slice(0, 80).map(function (x) {
          return '<tr data-rel="' + esc(x.id) + '"><td><strong>' + esc(x.subjectEntity) + '</strong></td>' +
            '<td><span class="tag-pill pill-info">' + esc(x.predicate) + '</span></td>' +
            '<td>' + esc(x.objectEntity) + '</td>' +
            '<td style="color:var(--text-2)">' + esc(x.domainDescription) + '</td></tr>';
        }).join('');
        done(head +
          '<div class="panel"><div class="panel-head"><h3>DCS 语义提升</h3>' +
          '<span class="note">DCS 原始描述 → 参数语义 → 工业对象 · 显示前 150 条，共 ' + n(res.dcsSemanticTotal) + ' 条</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
          '<th>DCS 原始描述</th><th>参数语义</th><th>工业对象</th><th>OWL Subject</th><th>DCS 点名</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div></div></div>' +
          '<div class="panel"><div class="panel-head"><h3>关系语义</h3>' +
          '<span class="note">起始对象 → 谓词 → 目标对象 → 工艺机理说明</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
          '<th>起始对象</th><th>谓词</th><th>目标对象</th><th>工艺机理与业务因果说明</th>' +
          '</tr></thead><tbody>' + relRows + '</tbody></table></div></div></div>');
      });

    } else if (K === 'measurementAnchor') {
      api.getMeasurementAnchors({}).then(function (res) {
        var rows = res.items.map(function (a) {
          return '<tr data-param="' + esc(a.parameterId) + '">' +
            '<td><strong>' + esc(a.relationEntityName || a.semanticName) + '</strong></td>' +
            '<td>' + esc(a.equipmentName) + '</td><td>' + esc(a.semanticName) + '</td>' +
            '<td class="mono">' + esc(a.tagName) + '</td><td class="mono">' + esc(a.blockType) + '</td>' +
            '<td class="mono">' + dash(a.unit) + '</td><td class="mono">' + esc(a.station) + '</td>' +
            '<td style="color:var(--text-2)">' + esc(a.rawDescription) + '</td></tr>';
        }).join('');
        var un = res.unanchoredEntities.map(function (e) {
          return '<tr data-entity="' + esc(e.id) + '"><td><strong>' + esc(e.name) + '</strong></td>' +
            '<td>' + typePill(e.type) + '</td><td>' + matchPill(e.matchStatus, e.matchStatusLabel) + '</td>' +
            '<td class="num mono">' + n(e.relationCount) + '</td></tr>';
        }).join('');
        done(head +
          '<div class="panel"><div class="panel-head"><h3>已建立的测量锚点</h3>' +
          '<span class="note">工业语义 → DCS Tag → DCS 块，共 ' + n(res.total) + ' 条</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
          '<th>关系对象</th><th>设备</th><th>参数语义</th><th>DCS 点名</th><th>DCS 块</th>' +
          '<th>单位</th><th>控制站</th><th>原点描述</th></tr></thead><tbody>' + rows +
          '</tbody></table></div></div></div>' +
          '<div class="panel"><div class="panel-head"><h3>暂无 DCS 测量锚点的关系对象</h3>' +
          '<span class="note">' + res.unanchoredEntities.length + ' 个 · 关系数据已加载，不虚构 DCS 点</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
          '<th>对象</th><th>类型</th><th>匹配状态</th><th class="num">关系数</th></tr></thead><tbody>' + un +
          '</tbody></table></div></div></div>');
      });

    } else if (K === 'causal') {
      api.getCausalRelations().then(function (res) {
        var rows = res.items.map(function (r) {
          var st = EDGE_STYLES.filter(function (s) { return s.category === r.category; })[0] || {};
          return '<tr data-rel="' + esc(r.id) + '">' +
            '<td>' + esc(r.area) + '</td>' +
            '<td><span class="tag-pill pill-plain"><i class="swatch" style="background:' +
            (st.color || '#f2557a') + '"></i>' + esc(r.category) + '</span></td>' +
            '<td data-entity-jump="' + esc(r.subject.id) + '"><strong>' + esc(r.subjectEntity) + '</strong></td>' +
            '<td><span class="tag-pill ' + (String(r.predicate).indexOf('负向') >= 0 ? 'pill-err' : 'pill-ok') + '">' +
            esc(r.predicate) + '</span></td>' +
            '<td data-entity-jump="' + esc(r.object.id) + '"><strong>' + esc(r.objectEntity) + '</strong></td>' +
            '<td class="num mono">' + esc(r.weight) + '</td>' +
            '<td style="color:var(--text-2)">' + esc(r.domainDescription) + '</td></tr>';
        }).join('');
        done(head + '<div class="panel"><div class="panel-head"><h3>因果 / 影响 / 质量关系</h3>' +
          '<span class="note">共 ' + res.total + ' 条，直接来自关系 Excel，不重新推断</span></div>' +
          '<div class="panel-body flush"><div class="tbl-wrap"><table class="tbl"><thead><tr>' +
          '<th>工段</th><th>关系大类</th><th>原因对象</th><th>影响方向</th><th>结果对象</th>' +
          '<th class="num">权重</th><th>工艺机理与业务因果说明</th></tr></thead><tbody>' + rows +
          '</tbody></table></div></div></div>');
      });

    } else if (K === 'provenance') {
      viewSources(function (html) { done(head + html); }, true);
    } else {
      done(head + emptyState('该分类暂无数据', ''));
    }
  }

  // ------------------------------------------------------------ 视图：数据源 / 质量 / API

  function viewSources(done, bare) {
    Promise.all([api.getDataSources(), api.getMeta()]).then(function (r) {
      var ds = r[0];
      var cards = ds.sources.map(function (s) {
        var sheets = (s.sheets || []).map(function (sh) {
          return '<tr><td class="mono">' + esc(sh.sheet) + '</td>' +
            '<td class="num mono">' + n(sh.rows) + '</td>' +
            '<td class="num mono">' + n(sh.validRows) + '</td>' +
            '<td class="num mono">' + (sh.errorRows ? '<span style="color:var(--err)">' + n(sh.errorRows) + '</span>' : '0') + '</td></tr>';
        }).join('');
        var stats = Object.keys(s.stats || {}).map(function (k) {
          return '<dt>' + esc(k) + '</dt><dd class="mono">' + n(s.stats[k]) + '</dd>';
        }).join('');
        return '<div class="panel"><div class="panel-head"><h3>' + esc(s.sourceTypeLabel) + '</h3>' +
          '<span class="note mono">' + esc(s.sourceType) + '</span>' +
          '<div class="right">' + (s.available ? '<span class="tag-pill pill-ok">已加载</span>' :
            '<span class="tag-pill pill-mute">未提供</span>') + '</div></div>' +
          '<div class="panel-body">' +
          '<dl class="kv"><dt>文件</dt><dd class="mono">' + esc(s.file) + '</dd>' +
          '<dt>加载时间</dt><dd class="mono">' + dash(s.loadedAt) + '</dd>' + stats + '</dl>' +
          '<p class="note-line" style="margin-top:10px">' + esc(s.note || '') + '</p>' +
          (sheets ? '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr>' +
            '<th>Sheet</th><th class="num">数据行数</th><th class="num">有效行数</th><th class="num">异常行数</th>' +
            '</tr></thead><tbody>' + sheets + '</tbody></table></div>' : '') +
          '</div></div>';
      }).join('');

      var boundary = Object.keys(ds.boundary).map(function (k) {
        return '<tr><td class="mono">' + esc(k) + '</td><td>' + esc(ds.boundary[k]) + '</td></tr>';
      }).join('');

      var html = (bare ? '' : '<div class="view-head"><h2>数据源管理</h2>' +
        '<p>现场 DCS 数据、工业关系 Excel、对象映射与规则数据源相互独立，' +
        'API 返回体以 <span class="mono">sourceType</span> 字段区分来源。</p></div>') +
        cards +
        '<div class="panel"><div class="panel-head"><h3>数据边界</h3>' +
        '<span class="note">四类数据源各自回答什么问题</span></div>' +
        '<div class="panel-body flush"><table class="tbl"><thead><tr><th>sourceType</th><th>职责</th>' +
        '</tr></thead><tbody>' + boundary + '</tbody></table></div></div>';
      done(html);
    });
  }

  function viewQuality(done) {
    api.getDataQuality().then(function (q) {
      var s = q.summary;
      var checkRows = q.checks.map(function (c) {
        return '<tr data-check="' + esc(c.check) + '">' +
          '<td>' + esc(c.group) + '</td><td><strong>' + esc(c.check) + '</strong></td>' +
          '<td style="color:var(--text-2)">' + esc(c.description) + '</td>' +
          '<td>' + (c.passed ? '<span class="tag-pill pill-ok">通过</span>' :
            '<span class="tag-pill ' + (c.severity === 'error' ? 'pill-err' : c.severity === 'warning' ? 'pill-warn' : 'pill-info') +
            '">' + n(c.issueCount) + ' 项</span>') + '</td></tr>';
      }).join('');

      var shown = q.issues.slice(0, 200);
      var issueRows = shown.map(function (i) {
        var cls = i.severity === 'error' ? 'pill-err' : i.severity === 'warning' ? 'pill-warn' : 'pill-info';
        return '<tr><td><span class="tag-pill ' + cls + '">' + esc(i.severity) + '</span></td>' +
          '<td>' + esc(i.check) + '</td><td style="color:var(--text-2)">' + esc(i.detail) + '</td>' +
          '<td class="mono" style="font-size:11px;color:var(--muted)">' +
          (i.source ? esc((i.source.sheet || '') + (i.source.row ? ' 第 ' + i.source.row + ' 行' : '')) : '—') +
          '</td></tr>';
      }).join('');

      done('<div class="view-head"><h2>数据质量报告</h2>' +
        '<p>导入 Excel 时自动执行一致性校验。检查只报告问题，不修改任何原始数据。</p></div>' +
        '<div class="stat-row">' +
        '<div class="stat"><div class="k">检查项</div><div class="v">' + n(s.checkCount) + '</div></div>' +
        '<div class="stat"><div class="k">通过</div><div class="v" style="color:var(--ok)">' + n(s.passedCount) + '</div></div>' +
        '<div class="stat"><div class="k">错误</div><div class="v" style="color:var(--err)">' + n(s.errorCount) + '</div></div>' +
        '<div class="stat is-warn"><div class="k">告警</div><div class="v">' + n(s.warningCount) + '</div></div>' +
        '<div class="stat"><div class="k">提示</div><div class="v" style="color:var(--info)">' + n(s.infoCount) + '</div></div>' +
        '</div>' +
        '<div class="panel"><div class="panel-head"><h3>检查项</h3></div><div class="panel-body flush">' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>分组</th><th>检查项</th><th>说明</th><th>结果</th>' +
        '</tr></thead><tbody>' + checkRows + '</tbody></table></div></div></div>' +
        '<div class="panel"><div class="panel-head"><h3>问题明细</h3>' +
        '<span class="note">共 ' + n(s.issueCount) + ' 项，显示前 ' + shown.length + ' 项</span></div>' +
        '<div class="panel-body flush"><div class="tbl-wrap scroll-y"><table class="tbl"><thead><tr>' +
        '<th>级别</th><th>检查项</th><th>问题描述</th><th>来源</th></tr></thead><tbody>' + issueRows +
        '</tbody></table></div></div></div>');
    });
  }

  function buildCrumbs(cb) {
    var c = [{ label: '6-APA 生产线', view: 'overview' }];
    function push(label, patch) { c.push(Object.assign({ label: label }, patch)); }
    if (S.view === 'areas') { push('工段与设备', { view: 'areas' }); return cb(c); }
    if (['area', 'equipment', 'parameter'].indexOf(S.view) >= 0) {
      push('工段与设备', { view: 'areas' });
      var tasks = [];
      if (S.areaId) tasks.push(api.getProcessAreas());
      Promise.all(tasks).then(function (r) {
        if (S.areaId && r[0]) {
          var a = r[0].items.filter(function (x) { return x.id === S.areaId; })[0];
          if (a) push(a.nameZh, { view: 'area', areaId: a.id });
        }
        var more = [];
        if (S.equipmentId) more.push(api.getEquipmentDetail(S.equipmentId));
        if (S.parameterId) more.push(api.getParameterDetail(S.parameterId));
        Promise.all(more).then(function (m) {
          m.forEach(function (x) {
            if (!x) return;
            if (x.owlSubject && x.tagCount != null && x.parameterCount != null) {
              push(x.name, { view: 'equipment', equipmentId: x.id, areaId: x.areaId });
            } else if (x.equipmentId) {
              push(x.name, { view: 'parameter', parameterId: x.id, equipmentId: x.equipmentId, areaId: x.areaId });
            }
          });
          cb(c);
        });
      });
      return;
    }
    if (S.view === 'entity') {
      push('关系图谱', { view: 'graph' });
      api.getRelationEntityDetail(S.entityId).then(function (e) {
        if (e) push(e.name, { view: 'entity', entityId: e.id });
        cb(c);
      });
      return;
    }
    if (S.view === 'category') {
      var cat = CATEGORIES.filter(function (x) { return x.key === S.categoryKey; })[0];
      push('本体分类', { view: 'overview' });
      if (cat) push(cat.name, { view: 'category', categoryKey: cat.key });
      return cb(c);
    }
    var names = { graph: '关系图谱', relations: '关系清单', entities: '关系对象', sources: '数据源管理', quality: '数据质量', api: 'API 接口' };
    if (names[S.view]) push(names[S.view], { view: S.view });
    cb(c);
  }

  // ------------------------------------------------------------ 事件委托

  function bind() {
    document.addEventListener('click', function (ev) {
      var t = ev.target;

      var nav = t.closest('[data-nav]');
      if (nav) {
        var view = nav.getAttribute('data-nav');
        var cat = nav.getAttribute('data-cat');
        return go({ view: view, categoryKey: cat || null });
      }

      var crumb = t.closest('[data-crumb]');
      if (crumb) {
        var c = S.crumbs[+crumb.getAttribute('data-crumb')];
        if (c) return go(Object.assign({ view: c.view }, c));
      }

      var jump = t.closest('[data-entity-jump]');
      if (jump && jump.getAttribute('data-entity-jump')) {
        ev.stopPropagation();
        return go({ view: 'entity', entityId: jump.getAttribute('data-entity-jump'), depth: 1 });
      }

      var ent = t.closest('[data-entity]');
      if (ent) return go({ view: 'entity', entityId: ent.getAttribute('data-entity'), depth: 1 });

      var eq = t.closest('[data-equip]');
      if (eq) return go({ view: 'equipment', equipmentId: eq.getAttribute('data-equip') });

      var pm = t.closest('[data-param]');
      if (pm) return go({ view: 'parameter', parameterId: pm.getAttribute('data-param') });

      var ar = t.closest('[data-area]');
      if (ar) return go({ view: 'area', areaId: ar.getAttribute('data-area') });

      var rel = t.closest('[data-rel]');
      if (rel) return inspectRelation(rel.getAttribute('data-rel'));

      var relcat = t.closest('[data-relcat]');
      if (relcat) return go({ view: 'relations', relFilters: { category: relcat.getAttribute('data-relcat') } });

      var pred = t.closest('[data-predicate]');
      if (pred) return go({ view: 'relations', relFilters: { predicate: pred.getAttribute('data-predicate') } });

      var rfc = t.closest('[data-rel-filter-cat]');
      if (rfc) return go({ view: 'relations', relFilters: { category: rfc.getAttribute('data-rel-filter-cat') } });

      var rfa = t.closest('[data-rel-filter-area]');
      if (rfa) return go({ view: 'relations', relFilters: { area: rfa.getAttribute('data-rel-filter-area') } });

      var groot = t.closest('[data-graph-root]');
      if (groot) return go({ view: 'graph', graphFilters: { rootId: groot.getAttribute('data-graph-root') }, depth: 1 });

      var gequip = t.closest('[data-graph-equip]');
      if (gequip) {
        ev.stopPropagation();
        return go({ view: 'graph', graphFilters: { rootId: gequip.getAttribute('data-graph-equip') }, depth: 2 });
      }

      var depth = t.closest('[data-depth]');
      if (depth) {
        S.depth = +depth.getAttribute('data-depth');
        document.querySelectorAll('[data-depth]').forEach(function (b) {
          b.classList.toggle('is-on', +b.getAttribute('data-depth') === S.depth);
        });
        var q = S.view === 'entity'
          ? { rootId: S.entityId, depth: S.depth }
          : Object.assign({ depth: S.depth }, S.graphFilters);
        return mountGraph(q);
      }

      var sd = t.closest('[data-showdcs]');
      if (sd) {
        S.showDcs = !S.showDcs;
        sd.classList.toggle('is-on', S.showDcs);
        return mountGraph(S.view === 'entity'
          ? { rootId: S.entityId, depth: S.depth }
          : Object.assign({ depth: S.depth }, S.graphFilters));
      }

      if (t.closest('[data-gf-reset]')) return go({ graphFilters: {} });
      if (t.closest('[data-rf-reset]')) return go({ relFilters: {} });
    });

    document.addEventListener('change', function (ev) {
      var gf = ev.target.closest('[data-gf]');
      if (gf) {
        var key = gf.getAttribute('data-gf');
        var v = gf.value;
        var patch = {};
        if (key === 'matched') patch.matched = v === '' ? undefined : v === '1';
        else patch[key] = v || undefined;
        S.graphFilters = Object.assign({}, S.graphFilters, patch);
        if (key === 'rootId') return go({});
        return mountGraph(Object.assign({ depth: S.depth }, S.graphFilters));
      }
      var rf = ev.target.closest('[data-rf]');
      if (rf) {
        var k = rf.getAttribute('data-rf');
        var patch2 = {};
        patch2[k] = rf.value || undefined;
        return go({ relFilters: Object.assign({}, S.relFilters, patch2) });
      }
    });

    var timer = null;
    document.addEventListener('input', function (ev) {
      var rf = ev.target.closest('[data-rf="keyword"]');
      if (!rf) return;
      clearTimeout(timer);
      var v = rf.value;
      timer = setTimeout(function () {
        var pos = v.length;
        S.relFilters = Object.assign({}, S.relFilters, { keyword: v || undefined });
        render();
        setTimeout(function () {
          var box = document.querySelector('[data-rf="keyword"]');
          if (box) { box.focus(); box.setSelectionRange(pos, pos); }
        }, 0);
      }, 260);
    });
  }

    api.getCategories().then(function (c) {

      (c.nodeStyles || []).forEach(function (s) { NODE_COLORS[s.type] = s.color; });
      CORE_STYLES.nodes = (c.nodeStyles || []).filter(function (s) {
        return ['生产工段', '生产设备', '设备部件', '工艺属性', '参数', 'DCS点', '物料流股',
          '控制仪表', '执行机构', '质量指标', '业务指标'].indexOf(s.type) >= 0;
      });
      return api.getDataSources();
    }).then(function (ds) {
      $('#src-chips').innerHTML = ds.sources.map(function (s) {
        return '<span class="chip' + (s.available ? '' : ' is-missing') + '">' +
          '<span class="tick">' + (s.available ? '✓' : '○') + '</span>' + esc(s.file) + '</span>';
      }).join('');
      $('#svc-label').textContent = api.mode === 'live' ? '本体服务 · 实时' : '本体服务 · 静态快照';
      bind();
      render();
    });
  }

  global.OntologyApp = { boot: boot, state: S };
})(window);

</script>
<script>window.OntologyApp && window.OntologyApp.boot();</script>
