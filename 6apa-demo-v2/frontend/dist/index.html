<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>6APA 本体 v2</title>
    <script type="module" crossorigin src="/assets/index-Cw2X2Hbr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BEWZo1qL.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 页面 8 秒还没渲染出来时给出原因，避免一片空白（脚本被拦截、浏览器太旧等）
      ;(function () {
        var errs = []
        window.addEventListener('error', function (e) { errs.push(e.message || (e.target && e.target.src) || '资源加载失败') }, true)
        setTimeout(function () {
          var app = document.getElementById('app')
          if (app && app.children.length) return
          app.innerHTML = '<div style="max-width:720px;margin:60px auto;padding:20px 24px;border:1px solid #d6dde7;border-radius:10px;' +
            'background:#ffffff;color:#1f2937;font:14px/1.7 sans-serif">' +
            '<h3 style="margin:0 0 8px">页面脚本没有运行</h3>' +
            '<div>1. 按 Ctrl+F5 强制刷新（清掉旧缓存）；</div>' +
            '<div>2. 关掉启动窗口，拉取最新代码后重新双击 run_demo.bat；</div>' +
            '<div>3. 请使用新版 Chrome / Edge；</div>' +
            '<div>4. 仍不行时按 F12 → Console，把红色报错截图发给开发。</div>' +
            (errs.length ? '<pre style="margin-top:10px;color:#dc2626;white-space:pre-wrap">' + errs.join('\n') + '</pre>' : '') +
            '</div>'
        }, 8000)
      })()
    </script>
  </body>
</html>
